<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sai Karthik Kocherlakota | Portfolio</title>
  <!-- Load Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0b1020;
      --ink-2:#1b2342;
      --glow:#68d2ff;
      --pop:#ff7ad9;
      --sun:#ffcc57;
      --lime:#93ff8d;
      --btn:#6a5cff;
      --white:#ffffff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#e7ecff;line-height:1.4;overflow-x:hidden;}
    body{
      background:#0a0e1a;
      position:relative;
      min-height:100vh;
    }
    /* global background using Image 1 with a gentle fade */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      background:url('Image 1.jpg') center/cover no-repeat fixed;
      opacity:0.55;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      background:linear-gradient(to bottom,
        rgba(10,14,26,0.0) 0%,
        rgba(10,14,26,0.6) 15%,
        rgba(10,14,26,0.85) 35%,
        #0a0e1a 55%,
        #0a0e1a 100%
      );
      pointer-events:none;
    }
    a{text-decoration:none;color:inherit}
    .wrap{max-width:1100px;margin:0 auto;padding:0 18px;}
    header{position:sticky;top:0;z-index:30;background:rgba(10,14,26,.6);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav{display:flex;align-items:center;justify-content:space-between;height:64px;}
    .brand{font-weight:800;letter-spacing:.5px;font-size:1.2rem;opacity:0.9;}
    .brand span{
      background:linear-gradient(90deg,var(--glow),var(--pop));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .menu a{margin-left:18px;font-weight:500;opacity:.9;transition:opacity .2s;}
    .menu a:hover{opacity:1;}

    /* hero section */
    .hero{position:relative;min-height:74vh;display:grid;grid-template-columns:1fr;align-items:center;padding-top:40px;padding-bottom:32px;}
    .hero h1{font-size:clamp(32px,5vw,56px);line-height:1.1;margin-bottom:16px;}
    .hero h1 .name{color:#ffffff;}
    .hero p{opacity:.95;max-width:620px;margin-bottom:28px;}
    .cta{display:flex;flex-wrap:wrap;gap:14px;}
    .btn{padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer;border:0;text-align:center;display:inline-block;}
    .btn.primary{background:var(--btn);color:#fff;box-shadow:0 10px 25px rgba(106,92,255,.35);}
    .btn.secondary{background:transparent;border:1.5px dashed rgba(255,255,255,.4);}

    /* Section spacing */
    section{padding:72px 0;}
    .title{font-weight:800;font-size:28px;margin-bottom:16px;}
    .muted{opacity:.85;margin-bottom:8px;max-width:700px;}

    /* Experience timeline */
    .timeline{border-left:3px solid rgba(255,255,255,.09);padding-left:20px;}
    .timeline .row{margin:20px 0;}
    .row .role{font-weight:700;}
    .row .co{opacity:.9;}
    .row .when{opacity:.7;font-weight:600;}

    /* Internships vertical timeline */
    .internship-timeline{position:relative;border-left:2px solid rgba(255,255,255,0.08);padding-left:30px;margin-top:12px;}
    .internship-item{position:relative;margin:30px 0;}
    .internship-item .icon{position:absolute;left:-16px;top:0;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:18px;}
    .internship-item .details{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;}
    .internship-item .details h3{margin:0;font-size:1rem;font-weight:700;}
    .internship-item .details .co{font-size:0.85rem;opacity:0.8;margin-top:4px;margin-bottom:10px;}
    .internship-item .details ul{margin:0;padding-left:18px;}
    .internship-item .details li{margin-bottom:6px;font-size:0.82rem;opacity:0.88;}

    /* Projects flip-card grid */
    .projects-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit, minmax(260px,1fr));margin-top:20px;}
    .flip-card{perspective:1000px;}
    .flip-card-inner{position:relative;width:100%;height:100%;transition:transform 0.8s;transform-style:preserve-3d;}
    .flip-card:hover .flip-card-inner{transform:rotateY(180deg);}
    .flip-card-front,.flip-card-back{position:absolute;inset:0;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);border-radius:14px;padding:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:6px;}
    .flip-card-front{font-size:1.05rem;font-weight:700;}
    .flip-card-back{transform:rotateY(180deg);font-size:0.9rem;line-height:1.4;}
    .flip-card-back ul{margin:0;padding-left:18px;text-align:left;}
    .flip-card-back li{margin-bottom:6px;font-size:0.82rem;opacity:0.88;list-style:disc;}

    /* Highlights grid */
    .highlights-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit, minmax(280px,1fr));margin-top:20px;}
    .highlight-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s ease, box-shadow .2s ease;}
    .highlight-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,0.4);}
    .highlight-card h3{font-size:1.1rem;font-weight:700;margin:0;}
    .highlight-card p{font-size:0.88rem;line-height:1.4;opacity:0.92;margin:0;}

    /* Contact */
    .contact-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    #contactBtn{transform-origin:center;transition:transform .2s,filter .2s;}
    #contactBtn.kicked{animation:hit .6s cubic-bezier(.2,.8,.3,1.3) 1;filter:drop-shadow(0 20px 30px rgba(255,122,217,.6));}
    @keyframes hit{
      0%{transform:scale(1) rotate(0deg)}
      20%{transform:scale(.94) rotate(-8deg)}
      45%{transform:scale(1.08) rotate(12deg)}
      70%{transform:scale(.98) rotate(-6deg)}
      100%{transform:scale(1) rotate(0deg)}
    }

    footer{padding:40px 0;border-top:1px solid rgba(255,255,255,.08);opacity:.85;text-align:center;font-size:.875rem;}
    .tech-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:20px 0 8px;font-size:0.9rem;}
    .tech-icons span{background:rgba(255,255,255,0.07);padding:6px 10px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:6px;}

    /* Responsive adjustments */
    @media(max-width:960px){
      .nav .menu{display:none;}
      .hero{grid-template-columns:1fr;}
    }
  </style>
</head>
